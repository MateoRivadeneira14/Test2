name: Deploy Login and Validate Microservices to EC2

on:
  push:
    branches:
      - test1

jobs:
  push_to_registry:
    name: Push Docker Images to Docker Hub
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Login image
        uses: docker/build-push-action@v4
        with:
          context: ./BackEnd/Domains/Auth/Login
          file: ./BackEnd/Domains/Auth/Login/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/login-service:latest

      - name: Executing remote ssh on EC2 server for Login
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.DNS_LOGIN }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Install Docker if it's not installed
            if ! command -v docker &> /dev/null
            then
              sudo dnf update -y
              sudo dnf install -y docker
              sudo systemctl start docker
              sudo systemctl enable docker
              sudo groupadd docker
              sudo usermod -aG docker ec2-user
            fi
            # Stop and remove existing container if exists
            sudo docker stop login-service || echo "No existing process found"
            sudo docker rm login-service || echo "No existing process found"
            # Pull and run the latest image
            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/login-service:latest
            sudo docker run -d -p 80:3001 --name login-service \
              -e DATABASE_URL=${{ secrets.DATABASE_URL }} \
              ${{ secrets.DOCKER_USERNAME }}/login-service

      - name: Build and push Validate image
        uses: docker/build-push-action@v4
        with:
          context: ./BackEnd/Domains/Auth/Validation
          file: ./BackEnd/Domains/Auth/Validation/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/validate-service:latest

      - name: Executing remote ssh on EC2 server for Validate
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.DNS_VALIDATE }}
          username: ${{ secrets.EC2_USER_UB }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Install Docker if it's not installed
            if ! command -v docker &> /dev/null
            then
              echo "Docker not found. Installing Docker..."
              sudo apt-get update -y
              sudo apt-get install -y docker.io
              sudo systemctl start docker
              sudo systemctl enable docker
            fi
            # Stop and remove existing container if exists
            sudo docker stop validate-service || echo "No existing process found"
            sudo docker rm validate-service || echo "No existing process found"
            # Pull and run the latest image
            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/validate-service:latest
            sudo docker run -d -p 80:3002 --name validate-service \
              -e DATABASE_URL=${{ secrets.DATABASE_URL }} \
              ${{ secrets.DOCKER_USERNAME }}/validate-service

       # Build and push Frontend (Next.js + React) Docker image
      - name: Build and push Docker image for Frontend
        uses: docker/build-push-action@v4
        with:
          context: ./FrontEnd/space-of-sport
          file: ./FrontEnd/space-of-sport/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/frontend:latest

      # Deploy Frontend Docker image to EC2 instance
      - name: Install Docker on EC2 instance
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.DNS_FRONT }}
          username: ${{ secrets.EC2_USER_UB }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Install Docker if it's not installed
            if ! command -v docker &> /dev/null
            then
              echo "Docker not found. Installing Docker..."
              sudo apt-get update -y
              sudo apt-get install -y docker.io
              sudo systemctl start docker
              sudo systemctl enable docker
            fi
            # Stop and remove existing container if exists
            sudo docker stop frontend-service || echo "No existing process found"
            sudo docker rm frontend-service || echo "No existing process found"
            # Pull and run the latest image
            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/frontend:latest
            sudo docker run -d -p 80:3000 --name frontend-service -e NEXT_PUBLIC_API_URL="http://ec2-3-82-209-106.compute-1.amazonaws.com:3001" ${{ secrets.DOCKER_USERNAME }}/frontend:latest
            